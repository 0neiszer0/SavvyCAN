# Fork-only workflow: builds the Windows x64 package for this fork's branches.
name: Fork Build (Windows x64)

on:
  push:
    branches:
      - "fork-ci"
  workflow_dispatch:

jobs:
  buildwindows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
           version: '6.10'
           modules: 'qtserialbus qtserialport'
           cache: true

      - name: Clone
        uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -G Ninja -B ${{github.workspace}}/build -S ${{github.workspace}} -DCMAKE_BUILD_TYPE=Release -DUSE_LIBUSB=OFF
          cmake --build ${{github.workspace}}/build --parallel

      - name: Package
        run: |
          mkdir package
          if (Test-Path "build/SavvyCAN.exe") { copy "build/SavvyCAN.exe" package/ } else { copy "build/Release/SavvyCAN.exe" package/ }
          & "${Env:QT_ROOT_DIR}/bin/windeployqt.exe" --release --no-opengl-sw package/SavvyCAN.exe
          mkdir package/help -Force | Out-Null
          mkdir package/translations -Force | Out-Null
          if (Test-Path "translations/*.qm") { copy translations/*.qm package/translations/ }
          copy help/*.md package/help/
          mkdir package/help/images -Force | Out-Null
          copy help/images/*.* package/help/images/
          mkdir package/examples -Force | Out-Null
          copy examples/*.* package/examples/
          mkdir package/canbus -Force | Out-Null
          copy "${Env:QT_ROOT_DIR}/plugins/canbus/*.*" package/canbus/
          mkdir package/tls -Force | Out-Null
          copy "${Env:QT_ROOT_DIR}/plugins/tls/*.*" package/tls/

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Windows_x64
          path: package
